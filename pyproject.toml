[project]
name = "folha-pagamento-qts-at2"
version = "0.1.0"
description = "Aplicação de folha de pagamento para a AT2 de QTS"
requires-python = ">=3.12"
dependencies = [
    "axe-playwright-python>=0.1.8",
    "faker>=37.0.0",
    "fastapi[standard]>=0.115.0",
    "locust>=2.32.0",
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-playwright[base-url]>=0.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: testes de integração com dependências isoladas",
    "e2e: testes ponta a ponta no navegador",
    "accessibility: testes de acessibilidade e teclado",
]
